name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore DentalSurgery.sln

      # Warnings are not errors in the build props, so the CI applies the
      # stricter bar rather than changing local development.
      - run: dotnet build DentalSurgery.sln -c Release --no-restore -warnaserror

      # The unit suite first: it is fast, and a failure here explains an
      # integration failure that would otherwise look mysterious.
      - name: Unit and service tests
        run: >
          dotnet test tests/DentalSurgery.Tests -c Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # The integration suite starts the real application and drives it over
      # HTTP, so it needs the web project's build output on disk. Debug, because
      # that is where the fixture looks for the entry point.
      - name: Build the application for the integration suite
        run: dotnet build src/DentalSurgery.Web -c Debug --no-restore

      - name: Integration tests
        run: >
          dotnet test tests/DentalSurgery.IntegrationTests -c Debug
          --logger "trx;LogFileName=integration.trx"
          --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  migrations:
    name: Migrations are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet tool restore
      - run: dotnet restore DentalSurgery.sln

      # A model change committed without its migration would otherwise be found
      # at deploy time, against a real database. This catches it at review time.
      - name: Check for un-scaffolded model changes (SQL Server)
        env:
          DENTAL_MIGRATION_PROVIDER: SqlServer
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/DentalSurgery.Migrations.SqlServer \
            --startup-project src/DentalSurgery.Web \
            --context DentalDbContext

      - name: Check for un-scaffolded model changes (SQLite)
        env:
          DENTAL_MIGRATION_PROVIDER: Sqlite
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/DentalSurgery.Migrations.Sqlite \
            --startup-project src/DentalSurgery.Web \
            --context DentalDbContext

      # The deployable migration artefact. Idempotent, so it is safe to run
      # against a database at any prior version.
      - name: Generate the SQL Server migration script
        env:
          DENTAL_MIGRATION_PROVIDER: SqlServer
        run: |
          dotnet ef migrations script --idempotent --output migrate.sql \
            --project src/DentalSurgery.Migrations.SqlServer \
            --startup-project src/DentalSurgery.Web \
            --context DentalDbContext

      - uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: migrate.sql

  # Generating the script proves it can be written, not that a database will
  # accept it. Those are different things, and the difference reached production:
  # the schema scaffolded and passed every check here, then failed on the real
  # server with "may cause cycles or multiple cascade paths" because SQL Server
  # refuses ON DELETE SET NULL on a self-reference and SQLite does not. Nothing
  # in between ever built the schema on SQL Server.
  #
  # So this builds it, on the version the deployment actually runs.
  sqlserver-schema:
    name: The schema builds on SQL Server
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          # Not a secret: a throwaway container that exists for one job, holds
          # nothing, and is destroyed with the runner. Varied per run so it is
          # never a standing value anyone could come to rely on.
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-Xy
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet tool restore
      - run: dotnet restore DentalSurgery.sln

      - name: Wait for SQL Server to accept connections
        run: |
          for attempt in $(seq 1 40); do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server is listening."
              exit 0
            fi
            sleep 3
          done
          echo "::error::SQL Server did not start."
          exit 1

      # The real test: apply every migration to an empty SQL Server database and
      # let the server judge the schema.
      - name: Apply the migrations
        env:
          DENTAL_MIGRATION_PROVIDER: SqlServer
          ConnectionStrings__DefaultConnection: >-
            Server=127.0.0.1,1433;Database=DentalSurgery-CI;User Id=sa;Password=Ci-${{ github.run_id }}-Xy;Encrypt=True;TrustServerCertificate=True;Connect Timeout=60
        run: |
          dotnet ef database update \
            --project src/DentalSurgery.Migrations.SqlServer \
            --startup-project src/DentalSurgery.Web \
            --context DentalDbContext

      # Applying twice proves the script is safe to re-run, which is what the
      # deployment relies on when a release is repeated.
      - name: Apply them again
        env:
          DENTAL_MIGRATION_PROVIDER: SqlServer
          ConnectionStrings__DefaultConnection: >-
            Server=127.0.0.1,1433;Database=DentalSurgery-CI;User Id=sa;Password=Ci-${{ github.run_id }}-Xy;Encrypt=True;TrustServerCertificate=True;Connect Timeout=60
        run: |
          dotnet ef database update \
            --project src/DentalSurgery.Migrations.SqlServer \
            --startup-project src/DentalSurgery.Web \
            --context DentalDbContext

  container:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dental-surgery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Vulnerable and deprecated packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore DentalSurgery.sln

      # A known-vulnerable transitive package in a system holding patient
      # records should fail the build, not appear in a report nobody reads.
      - name: Fail on vulnerable packages
        run: |
          dotnet list DentalSurgery.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Report deprecated packages
        continue-on-error: true
        run: dotnet list DentalSurgery.sln package --deprecated --include-transitive
