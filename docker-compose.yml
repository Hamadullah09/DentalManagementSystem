# Local stack that matches production: the application against SQL Server rather
# than the SQLite file used by "dotnet run".
#
#   docker compose up --build
#   http://localhost:8080
#
# The secrets below are local-only placeholders. In a deployment these come from
# the platform's secret store and never from a file in the repository.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev#Passw0rd!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - dental-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: SqlServer
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=DentalSurgery;User Id=sa;Password=LocalDev#Passw0rd!;TrustServerCertificate=True;Encrypt=True"

      # Single instance here, so migrating on start-up is safe. A real
      # deployment runs migrations as a release step and leaves this false.
      Seed__MigrateOnStartup: "true"

      # Bootstrap administrator. Required outside Development; the account is
      # created with a forced password change.
      Seed__AdminEmail: "admin@dentalsurgery.local"
      Seed__AdminPassword: "LocalBootstrap#2026!"

      # HTTPS terminates at the proxy in front of this container.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - dental-documents:/app/App_Data

volumes:
  dental-db:
  dental-documents:
